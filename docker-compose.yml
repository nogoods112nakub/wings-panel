services:
  db:
    image: postgres:15-alpine
    container_name: panel-db
    restart: always
    command: ["postgres", "-c", "max_connections=250"]
    environment:
      POSTGRES_USER: panel_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panel_password_secure_99}
      POSTGRES_DB: panel_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel_user -d panel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  panel:
    build:
      context: .
      dockerfile: Dockerfile.panel
    container_name: panel-master
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://panel_user:${POSTGRES_PASSWORD:-panel_password_secure_99}@db:5432/panel_db
      - JWT_SECRET=${JWT_SECRET:-}
      - DAEMON_TOKEN=${DAEMON_TOKEN:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin12345}
      - DAEMON_HOST=daemon-node
      - DAEMON_PORT=8080
      - SERVER_MEMORY_MB=16384
      - SERVER_CPU_COUNT=4
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_PANEL_URL: ${PANEL_URL:-http://localhost:8000}
    container_name: panel-frontend
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_PANEL_URL=${PANEL_URL:-http://localhost:8000}
    depends_on:
      - panel

  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: panel-monitor
    restart: always
    environment:
      - PANEL_URL=http://panel-master:8000
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin12345}
      - INTERVAL=5
    depends_on:
      - panel

  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    container_name: daemon-node
    restart: always
    ports:
      - "8080:8080"
      - "7681-7781:7681-7781"
    environment:
      - DAEMON_TOKEN=${DAEMON_TOKEN:-}
      - SERVERS_DIR=/srv/daemon/servers
      - HOST_SERVERS_DIR=/srv/daemon/servers
      - DOCKER_URL=unix:///var/run/docker.sock
      - DOCKER_NETWORK=pterodactyl-net
      - SERVER_VOLUME=server-data
    volumes:
      - server-data:/srv/daemon/servers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db

  velocity:
    build:
      context: .
      dockerfile: Dockerfile.velocity
    image: wings-panel-velocity
    container_name: panel-velocity-builder
    profiles:
      - build
    restart: "no"

networks:
  default:
    name: pterodactyl-net

volumes:
  pgdata:
  server-data:
